<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 聊天助手</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 720px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      background: #181825;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #1e1e2e;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: #89b4fa; }

    #new-chat-btn {
      font-size: 0.8rem;
      padding: 6px 14px;
      border: 1px solid #45475a;
      border-radius: 6px;
      background: transparent;
      color: #cdd6f4;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    #new-chat-btn:hover { background: #313244; border-color: #89b4fa; }

    /* Message list */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messages:empty::before {
      content: "发送消息开始对话";
      color: #585b70;
      font-size: 0.9rem;
      margin: auto;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user  { align-self: flex-end; background: #313244; color: #cdd6f4; }
    .msg.ai    { align-self: flex-start; background: #1e1e2e; color: #cdd6f4; border: 1px solid #313244; }
    .msg.error { align-self: flex-start; background: #1e1e2e; color: #f38ba8; border: 1px solid #f38ba8; }

    /* Loading bubble */
    .msg.loading {
      align-self: flex-start;
      background: #1e1e2e;
      border: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a6adc8;
    }
    .dots { display: flex; gap: 4px; }
    .dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #89b4fa;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1.1); opacity: 1; }
    }

    /* Input row */
    #input-row {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #1e1e2e;
      border-top: 1px solid #313244;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 8px;
      color: #cdd6f4;
      font-size: 0.92rem;
      padding: 10px 14px;
      resize: none;
      height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    #user-input:focus { border-color: #89b4fa; }

    #send-btn {
      padding: 0 18px;
      height: 44px;
      border-radius: 8px;
      border: none;
      background: #89b4fa;
      color: #1e1e2e;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { background: #b4befe; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Timeout progress bar */
    #timeout-bar {
      height: 3px;
      background: #313244;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      display: none;
    }
    #timeout-bar.active { display: block; }
    #timeout-fill {
      height: 100%;
      background: #89b4fa;
      width: 100%;
      transform-origin: left;
      transition: transform linear;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🤖 AI 聊天助手</h1>
    <button id="new-chat-btn">＋ 新对话</button>
  </header>

  <div id="timeout-bar"><div id="timeout-fill"></div></div>

  <div id="messages" role="log" aria-live="polite"></div>

  <div id="input-row">
    <textarea
      id="user-input"
      placeholder="输入消息，按 Enter 发送…"
      rows="1"
      aria-label="消息输入框"
    ></textarea>
    <button id="send-btn" aria-label="发送">发送</button>
  </div>
</div>

<script>
  // Configuration
  const REQUEST_TIMEOUT_MS = 30000;  // 30 s — after this the request is aborted
  const API_ENDPOINT = "/api/chat";  // replace with your actual endpoint

  // State
  let abortController = null;
  let timeoutTimer    = null;
  let isLoading       = false;

  // DOM refs
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const newChatBtn  = document.getElementById("new-chat-btn");
  const timeoutBar  = document.getElementById("timeout-bar");
  const timeoutFill = document.getElementById("timeout-fill");

  // Helpers
  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function createLoadingBubble() {
    const div = document.createElement("div");
    div.className = "msg loading";
    div.innerHTML = '<span>正在工作</span><div class="dots"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function setLoading(active) {
    isLoading = active;
    sendBtn.disabled = active;
    inputEl.disabled = active;
  }

  function startTimeoutBar(ms) {
    timeoutBar.classList.add("active");
    timeoutFill.style.transition = "none";
    timeoutFill.style.transform  = "scaleX(1)";
    // Force reflow so the initial state is painted before starting the transition
    void timeoutFill.offsetWidth;
    timeoutFill.style.transition = "transform " + ms + "ms linear";
    timeoutFill.style.transform  = "scaleX(0)";
  }

  function stopTimeoutBar() {
    timeoutBar.classList.remove("active");
    timeoutFill.style.transition = "none";
    timeoutFill.style.transform  = "scaleX(1)";
  }

  function cancelRequest() {
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
    clearTimeout(timeoutTimer);
    stopTimeoutBar();
    setLoading(false);
  }

  // Core: send message
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    inputEl.value = "";
    inputEl.style.height = "44px";

    appendMessage("user", text);
    const loadingBubble = createLoadingBubble();
    setLoading(true);
    startTimeoutBar(REQUEST_TIMEOUT_MS);

    abortController = new AbortController();

    // Hard timeout: abort the fetch if it hasn't finished in time.
    // The resulting AbortError is caught in the catch block below.
    timeoutTimer = setTimeout(function() {
      abortController.abort();
    }, REQUEST_TIMEOUT_MS);

    try {
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
        signal: abortController.signal,
      });

      clearTimeout(timeoutTimer);

      if (!response.ok) {
        throw new Error("服务器错误 (" + response.status + ")");
      }

      const data = await response.json();
      // Use data.reply if present; fall back to a friendly message for unexpected shapes
      const reply = (data && data.reply) ? data.reply : "(无响应内容)";

      loadingBubble.remove();
      appendMessage("ai", reply);

    } catch (err) {
      loadingBubble.remove();

      if (err.name === "AbortError") {
        appendMessage(
          "error",
          "⚠️ 请求超时：AI 响应时间过长，已自动取消。\n请检查网络连接，或稍后再试。"
        );
      } else {
        appendMessage(
          "error",
          "⚠️ 出错了：" + err.message + "\n请检查网络连接后重试。"
        );
      }
    } finally {
      cancelRequest();
    }
  }

  // New chat: reset everything cleanly
  function startNewChat() {
    cancelRequest();
    messagesEl.innerHTML = "";
    inputEl.value = "";
    inputEl.style.height = "44px";
    inputEl.focus();
  }

  // Event listeners
  sendBtn.addEventListener("click", sendMessage);

  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-grow textarea
  inputEl.addEventListener("input", function() {
    inputEl.style.height = "44px";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  newChatBtn.addEventListener("click", startNewChat);
</script>
</body>
</html>
